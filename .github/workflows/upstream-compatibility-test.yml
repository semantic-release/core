name: Upstream Compatibility Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  NPM_CONFIG_COLOR: always
  UPSTREAM_REPOSITORY: semantic-release/semantic-release
  # TODO: update to appropriate stable branch `master` later when the core integration is stable and released
  UPSTREAM_REF: alpha

jobs:
  semantic-release:
    name: semantic-release compatibility test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm clean-install
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: semantic-release

      - run: git config --global user.name github-actions
      - run: git config --global user.email github-actions@github.com
      - run: npm clean-install
        working-directory: semantic-release
      - run: npm install --no-save --package-lock=false "$RUNNER_TEMP"/semantic-release-core-*.tgz
        working-directory: semantic-release
      - run: npm run test:e2e
        working-directory: semantic-release
